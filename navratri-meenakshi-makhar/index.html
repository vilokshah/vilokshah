<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meenakshi Navratri Makhar · 3D Idea</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Tiro+Devanagari+Sanskrit:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <div class="hud">
        <header class="topbar">
          <div>
            <p class="kicker">Madurai · Meenakshi Amman</p>
            <h1>Navarātri Makhar</h1>
            <p class="sub">Full-wall backdrop around a 4 ft × 4 ft home temple</p>
          </div>
          <div class="controls">
            <button id="btn-front">Front</button>
            <button id="btn-three">3/4 view</button>
            <button id="btn-close">Shrine close-up</button>
            <button id="btn-lamps">Lamps</button>
          </div>
        </header>
        <aside class="panel" id="goddess-panel"></aside>
        <section class="legend">
          <p class="kicker">Nine goddesses · horseshoe</p>
          <ol id="legend-list"></ol>
        </section>
        <p class="hint">Drag to orbit · click a niche · 12 ft × 9 ft wall</p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
